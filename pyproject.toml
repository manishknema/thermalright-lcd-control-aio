
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermalright-lcd-control"
version = "1.4.0"
description = "Linux Thermal rigth lcd display control"
authors = [{ name = "REJEB BEN REJEB", email = "benrejebrejeb@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.13.7"
# Headless core: everything the LCD service needs, including the local API and
# the web UI (stdlib http.server + static files). OpenCV video backgrounds and
# OTLP export are extras. The PySide6 GUI was removed (Vigyan packaging; see
# docs/GUI_FEATURE_INVENTORY.md for what the web UI re-implements).
dependencies = [
    "hid>=1.0.8",
    "psutil>=7.1.3",
    "pyusb>=1.3.1",
    "pillow>=12.0.0",
    "pyyaml>=6.0.2",
    "numpy>=2.0",
    "nvidia-ml-py>=12.570",
]

[project.optional-dependencies]
video = [
    "opencv-python-headless>=4.12.0.88",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
thermalright-lcd-control-service = "thermalright_lcd_control.service:main"
thermalright-lcd-control-probe = "thermalright_lcd_control.showcase.probe:main"

# Configuration Hatchling
[tool.hatch.build.targets.wheel]
packages = ["src/thermalright_lcd_control"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.uv]
# gui ships opencv-python, video ships opencv-python-headless; both provide cv2.
conflicts = [[{ extra = "gui" }, { extra = "video" }]]
