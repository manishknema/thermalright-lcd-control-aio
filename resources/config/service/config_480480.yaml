# Service defaults for 480x480 panels (Vigyan packaging). Installed root-owned
# under /etc/vigyan/thermalright/aio/; the service never writes here. Everything a
# user changes from the web UI lives in service.state_dir (owned by the service user).
#
# service.api      local HTTP API + web UI. Loopback only unless lan: true; every
#                  /api/* call needs the token in token_file (the gateway injects it).
# service.defaults first-run selection: a built-in design + a theme pack.
# service.extras   optional readings: llm.tokens_s from a Prometheus counter and
#                  svc.<name> health dots (http(s) URL or tcp://host:port).
# telemetry        the same readings as OTLP metrics to the node-local collector.
# display          upstream theme, used only when the service: block is removed.
service:
  state_dir: /var/lib/vigyan/thermalright
  model: ''
  api:
    enabled: true
    bind: 127.0.0.1
    port: 7431
    lan: false
    token_file: /etc/vigyan/secret.d/thermalright-api.token
  defaults:
    design: ai-node
    pack: slate
    mark: {}
    rotate: []
  extras:
    tokens:
      url: ''
      metric: vllm:generation_tokens_total
    services: {}
  legacy_theme_dirs: []
  pack_dirs: []
telemetry:
  enabled: true
  otlp_endpoint: http://127.0.0.1:4318
  interval_seconds: 15
display:
  background:
    path: ./resources/themes/backgrounds/y010.png
    type: image
  date:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 24
    position:
      x: 15
      y: 3
    text: ''
  foreground:
    alpha: 1.0
    enabled: true
    path: ./resources/themes/foregrounds/{resolution}/006b.png
    position:
      x: 0
      y: 0
  metrics:
    configs:
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: cpu_temperature
      position:
        x: 54
        y: 104
      unit: °
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: gpu_temperature
      position:
        x: 253
        y: 102
      unit: °
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: cpu_frequency
      position:
        x: 89
        y: 33
      unit: MHZ
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: gpu_frequency
      position:
        x: 90
        y: 171
      unit: MHZ
    enabled: true
  rotation: 0
  time:
    color: '#FFFFFFFF'
    enabled: true
    font_size: 24
    position:
      x: 153
      y: 103
    text: ''
