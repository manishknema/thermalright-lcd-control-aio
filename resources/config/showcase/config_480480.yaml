# Showcase layout for 480x480 panels (Vigyan packaging).
# `showcase.enabled: true` draws the hardware dashboard; set it false (or let the
# GUI rewrite this file) to fall back to the upstream theme in `display:`.
# `telemetry` sends the same readings as OTLP metrics to the node-local collector.
showcase:
  enabled: true
  refresh_seconds: 1.0
  title: '{hostname}'
  temp_warn: 70
  temp_crit: 85
  rotation: 0
telemetry:
  enabled: true
  otlp_endpoint: http://127.0.0.1:4318
  interval_seconds: 15
display:
  background:
    path: ./resources/themes/backgrounds/y010.png
    type: image
  date:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 24
    position:
      x: 15
      y: 3
    text: ''
  foreground:
    alpha: 1.0
    enabled: true
    path: ./resources/themes/foregrounds/{resolution}/006b.png
    position:
      x: 0
      y: 0
  metrics:
    configs:
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: cpu_temperature
      position:
        x: 54
        y: 104
      unit: °
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: gpu_temperature
      position:
        x: 253
        y: 102
      unit: °
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: cpu_frequency
      position:
        x: 89
        y: 33
      unit: MHZ
    - color: '#FFFFFFFF'
      enabled: true
      font_size: 24
      format_string: '{label}{value}{unit}'
      label: ''
      name: gpu_frequency
      position:
        x: 90
        y: 171
      unit: MHZ
    enabled: true
  rotation: 0
  time:
    color: '#FFFFFFFF'
    enabled: true
    font_size: 24
    position:
      x: 153
      y: 103
    text: ''
